name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────── Frontend ──────────────────────────────
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Detect real source files
        id: detect
        run: |
          count=$(find src -type f \( -name '*.vue' -o -name '*.ts' -o -name '*.tsx' \) ! -name '*.d.ts' -size +20c | wc -l)
          echo "source_count=$count" >> "$GITHUB_OUTPUT"

      - name: Type check
        if: steps.detect.outputs.source_count > 0
        run: |
          cd frontend
          npx vue-tsc --noEmit

      - name: Run unit tests
        if: steps.detect.outputs.source_count > 0
        run: |
          cd frontend
          npm run test:unit

      - name: Run lint
        if: steps.detect.outputs.source_count > 0
        run: |
          cd frontend
          npm run lint

  # ──────────────────────── Backend ───────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect real test files
        id: detect
        run: |
          count=$(find tests -type f -name 'test_*.py' -size +20c | wc -l)
          echo "test_count=$count" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.detect.outputs.test_count > 0
        run: |
          cd backend
          pytest -q
