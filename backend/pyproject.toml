"""Test pyproject.toml with pytest configuration."""
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = """
    --strict-markers
    -ra
    -q
    --tb=short
"""
pythonpath = [".", ".."]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests (default)",
]
